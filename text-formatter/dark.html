<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatter - Dark Code Editor Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            overflow: hidden;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background-color: #1e1e1e;
            color: #e0e0e0;
            padding: 40px 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 15%, rgba(69, 217, 187, 0.85), transparent 20%),
                radial-gradient(circle at 82% 18%, rgba(166, 114, 255, 0.72), transparent 18%),
                radial-gradient(circle at 60% 70%, rgba(101, 205, 255, 0.68), transparent 22%);
            background-size: 220% 220%;
            filter: blur(110px);
            opacity: 0.96;
            animation: auroraGlow 26s ease-in-out infinite;
        }

        @keyframes auroraGlow {
            0% {
                background-position: 12% 12%, 85% 22%, 60% 72%;
            }
            25% {
                background-position: 18% 5%, 88% 12%, 48% 78%;
            }
            50% {
                background-position: 22% 8%, 70% 18%, 55% 85%;
            }
            75% {
                background-position: 15% 20%, 80% 10%, 62% 70%;
            }
            100% {
                background-position: 12% 12%, 85% 22%, 60% 72%;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        

        h1 {
            font-size: 24px;
            color: #4ec9b0;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .editor-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .editor-section {
            display: flex;
            flex-direction: column;
            background-color: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            overflow: hidden;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #858585;
            padding: 12px 16px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #3e3e42;
        }

        textarea {
            flex: 1;
            padding: 16px;
            border: none;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }

        #output {
            animation: none;
        }

        .output-appear {
            animation: outputFadeIn 0.2s ease-out;
        }

        @keyframes outputFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        textarea:focus {
            outline: none;
            background-color: #252526;
        }

        .stats {
            padding: 12px 16px;
            font-size: 12px;
            color: #858585;
            background-color: #1e1e1e;
            border-top: 1px solid #3e3e42;
        }

        .button-group {
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            background-color: #1e1e1e;
            border-top: 1px solid #3e3e42;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #3e3e42;
            background-color: #0e639c;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        button:hover {
            background-color: #1177bb;
            border-color: #007acc;
        }

        button.primary {
            background-color: #007acc;
        }

        button.primary:hover {
            background-color: #1177bb;
        }

        @media (max-width: 768px) {
            .editor-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text Formatter</h1>
        <div class="editor-wrapper">
            <div class="editor-section">
                <div class="section-title">Исходный текст</div>
                <textarea id="input" placeholder="Paste your messy text here...">  Это   пример  текста  с  «фигурными кавычками».


Много   пустых   строк.</textarea>
                <div class="stats" id="inputStats">Слов: 0</div>
            </div>
            <div class="editor-section">
                <div class="section-title">Очищенный результат</div>
                <textarea id="output" placeholder="Результат форматирования..." readonly></textarea>
                <div class="stats" id="outputStats">Слов: 0</div>
                <div class="button-group">
                    <button class="primary" onclick="copyToClipboard()">Копировать в буфер обмена</button>
                    <button onclick="exportToFile()">Экспортировать</button>
                    <button onclick="saveText()">Сохранить</button>
                    <button onclick="clearText()">Очистить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputTextarea = document.getElementById('input');
        const outputTextarea = document.getElementById('output');

        function formatText(text) {
            // Заменять фигурные кавычки на прямые
            text = text.replace(/[""]/g, '"');
            text = text.replace(/['']/g, "'");
            
            // Удалять двойные пробелы и заменять на одинарные
            text = text.replace(/  +/g, ' ');
            
            // Удалять пробелы в начале и конце каждой строки
            text = text.split('\n').map(line => line.trim()).join('\n');
            
            // Сводить несколько пустых строк к одной
            text = text.replace(/\n\n\n+/g, '\n\n');
            
            return text.trim();
        }

        function countWords(text) {
            return text.trim().split(/\s+/).filter(word => word.length > 0).length;
        }

        function updateOutput() {
            const input = inputTextarea.value;
            const output = formatText(input);
            outputTextarea.value = output;
            outputTextarea.classList.remove('output-appear');
            void outputTextarea.offsetWidth;
            outputTextarea.classList.add('output-appear');
            
            document.getElementById('inputStats').textContent = `Слов: ${countWords(input)}`;
            document.getElementById('outputStats').textContent = `Слов: ${countWords(output)}`;
        }

        function copyToClipboard() {
            outputTextarea.select();
            document.execCommand('copy');
            alert('Текст скопирован в буфер обмена!');
        }

        function exportToFile() {
            const text = outputTextarea.value;
            if (!text.trim()) {
                alert('Нет текста для экспорта!');
                return;
            }
            
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', 'formatted_text.txt');
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        function saveText() {
            const text = inputTextarea.value;
            localStorage.setItem('formattedText', text);
            alert('Текст сохранен!');
        }

        function loadSavedText() {
            const saved = localStorage.getItem('formattedText');
            if (saved) {
                inputTextarea.value = saved;
                updateOutput();
            }
        }

        function clearText() {
            inputTextarea.value = '';
            outputTextarea.value = '';
            updateOutput();
        }

        inputTextarea.addEventListener('input', updateOutput);
        loadSavedText();
        updateOutput();
    </script>
</body>
</html>
